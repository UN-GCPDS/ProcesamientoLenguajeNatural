name: pln-clase10-n8n
services:
  dev:
    image: mcr.microsoft.com/devcontainers/python:3.11
    volumes:
      # Codigo del repo dentro del contenedor de desarrollo
      # (el socket de Docker lo monta el feature docker-outside-of-docker,
      # no agregar /var/run/docker.sock aqui: produce "duplicate mount")
      - ..:/workspaces/ProcesamientoLenguajeNatural:cached
    command: sleep infinity
    working_dir: /workspaces/ProcesamientoLenguajeNatural

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # --- Anti "Connection lost" en Codespaces ---
      # n8n genera las URLs del editor y los eventos push con estas variables.
      # Si ves el banner "Connection lost", haz esto:
      # 1. Copia tu URL forwardeada de la pestana PORTS
      #    (ej: https://TU-CODESPACE-5678.app.github.dev)
      # 2. Descomenta las dos lineas, pega tu URL (con / final) y recrea:
      #      docker compose up -d --force-recreate n8n
      # 3. Abre n8n SIEMPRE con esa URL https, no con localhost.
      # - N8N_EDITOR_BASE_URL=https://TU-CODESPACE-5678.app.github.dev/
      # - WEBHOOK_URL=https://TU-CODESPACE-5678.app.github.dev/
    volumes:
      - n8n_data:/home/node/.n8n
      # Monta el repo (solo lectura) para que el nodo Spreadsheet File
      # pueda leer el inventario sin subirlo a mano.
      # Ruta dentro de n8n: /home/node/files/Clase 10/Inventario Laboratorio UNAL.xlsx
      - ..:/home/node/files:ro

volumes:
  n8n_data:
